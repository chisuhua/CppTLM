# CppTLM CI/CD — GitHub Actions
name: CppTLM CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================================
  # 构建与测试
  # ============================================================================
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
        use-asan: [OFF, ON]
        exclude:
          # ASan 仅对 Debug 构建生效（Release 下效果差且无意义）
          - build-type: Release
            use-asan: ON

    name: Build (${{ matrix.build-type }}, ASan=${{ matrix.use-asan }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ccache ninja-build

    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.use-asan }}
        max-size: 200M

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DUSE_ASAN=${{ matrix.use-asan }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: |
        if [ -f build/bin/cpptlm_tests ]; then
          cd build && ctest --output-on-failure -j4
        else
          echo "Test binary not found"
          exit 1
        fi

    - name: Run E2E simulation tests (Release only)
      if: matrix.build-type == 'Release'
      run: ./scripts/test/ci_e2e_test.sh

    - name: Run quick test suite (Python + key C++)
      if: matrix.build-type == 'Release'
      run: |
        python3 -m pip install --quiet networkx pydot pytest
        ./scripts/test/run_all_tests.sh --quick

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ runner.os }}-${{ matrix.build-type }}-${{ matrix.use-asan }}-${{ github.run_id }}
        path: build/Testing/
        retention-days: 7

  # ============================================================================
  # 代码格式检查
  # ============================================================================
  code-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install clang-format
      run: sudo apt-get install -y clang-format
    - name: Check format
      run: |
        chmod +x ./scripts/format.sh
        ./scripts/format.sh --check
